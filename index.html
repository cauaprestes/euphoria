const I18nContext = createContext({ lang: "pt", t: TRANSLATIONS.pt, setLang: () => {} });
const useI18n = () => useContext(I18nContext);

function detectLang() {
  try {
    const saved = localStorage.getItem("euphoria:lang");
    if (saved && TRANSLATIONS[saved]) return saved;
  } catch {}
  const nav = (navigator.language || "pt").slice(0, 2).toLowerCase();
  return nav === "es" ? "es" : nav === "en" ? "en" : "pt";
}

function I18nProvider({ children }) {
  const [lang, setLang] = useState(detectLang);
  useEffect(() => {
    document.documentElement.lang = LANGS.find((l) => l.id === lang).html;
    document.title = TRANSLATIONS[lang].meta.title;
    try {
      localStorage.setItem("euphoria:lang", lang);
    } catch {}
  }, [lang]);
  const value = useMemo(() => ({ lang, setLang, t: TRANSLATIONS[lang] }), [lang]);
  return <I18nContext.Provider value={value}>{children}</I18nContext.Provider>;
}

// Em ES/EN, inclui o nome em português entre parênteses para a recepção.
const serviceNameForMessage = (lang, id) => {
  const local = serviceName(lang, id);
  const pt = serviceName("pt", id);
  return lang === "pt" || local === pt ? local : `${local} (${pt})`;
};

function useScrolledPast(threshold) {
  const [past, setPast] = useState(false);
  useEffect(() => {
    const onScroll = () => setPast(window.scrollY > threshold);
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, [threshold]);
  return past;
}

function useInViewOnce(threshold = 0.35) {
  const ref = useRef(null);
  const [seen, setSeen] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (!("IntersectionObserver" in window)) {
      setSeen(true);
      return;
    }
    const io = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) {
          setSeen(true);
          io.disconnect();
        }
      },
      { threshold }
    );
    io.observe(el);
    return () => io.disconnect();
  }, [threshold]);
  return [ref, seen];
}

function mulberry32(a) {
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Arte ilustrativa de fios (troque por fotos reais em CONFIG.beforeImage / afterImage).
function HairArt({ variant = "after", seed = 1 }) {
  const after = variant === "after";
  const uid = useMemo(() => `hair-${variant}-${seed}-${Math.random().toString(36).slice(2, 7)}`, [variant, seed]);

  const { strands, flyaways } = useMemo(() => {
    const r = mulberry32(after ? 11 + seed : 5 + seed);
    const n = after ? 92 : 84;
    const strands = [];
    for (let i = 0; i < n; i++) {
      const x0 = -40 + (i / n) * 480 + (r() - 0.5) * 8;
      const amp = after ? 16 + r() * 8 : 5 + r() * 9;
      const freq = after ? 0.011 + r() * 0.002 : 0.018 + r() * 0.03;
      const phase = after ? i * 0.045 : r() * Math.PI * 2;
      let d = "";
      for (let y = -20; y <= 520; y += 12) {
        const k = 0.35 + y / 520;
        let x = x0 + Math.sin(y * freq + phase) * amp * k;
        if (!after) x += (r() - 0.5) * 9 * k;
        d += `${y === -20 ? "M" : "L"}${x.toFixed(1)} ${y} `;
      }
      strands.push({ d, w: after ? 1.2 + r() * 2.4 : 0.8 + r() * 2, o: after ? 0.55 + r() * 0.45 : 0.35 + r() * 0.5, g: Math.floor(r() * 3) });
    }
    const flyaways = [];
    if (!after) {
      for (let i = 0; i < 34; i++) {
        const x = r() * 400;
        const y = 40 + r() * 420;
        flyaways.push(`M${x.toFixed(1)} ${y.toFixed(1)} q ${((r() - 0.5) * 40).toFixed(1)} ${(-10 - r() * 30).toFixed(1)} ${((r() - 0.5) * 60).toFixed(1)} ${(-20 - r() * 40).toFixed(1)}`);
      }
    }
    return { strands, flyaways };
  }, [after, seed]);

  const palette = after
    ? [
        ["#3a221f", "#8d5b4c", "#efcdb8"],
        ["#2e1b1a", "#a56f60", "#f6dccb"],
        ["#3d2622", "#c08a78", "#e9bfa8"],
      ]
    : [
        ["#3b302a", "#5a4a3f", "#6f5d4f"],
        ["#33291f", "#493b31", "#5f5045"],
        ["#40342b", "#5e4d40", "#7a6655"],
      ];

  return (
    <svg viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice" className="absolute inset-0 h-full w-full" aria-hidden="true">
      <defs>
        <linearGradient id={`${uid}-bg`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stopColor={after ? "#2b1a22" : "#262220"} />
          <stop offset="1" stopColor={after ? "#1a1214" : "#1c1a19"} />
        </linearGradient>
        {palette.map((p, i) => (
          <linearGradient key={i} id={`${uid}-g${i}`} gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="500">
            <stop offset="0" stopColor={p[0]} />
            <stop offset=".5" stopColor={p[1]} />
            <stop offset="1" stopColor={p[2]} />
          </linearGradient>
        ))}
        <linearGradient id={`${uid}-shine`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stopColor="#fff2ec" stopOpacity="0" />
          <stop offset=".5" stopColor="#fff2ec" stopOpacity=".5" />
          <stop offset="1" stopColor="#fff2ec" stopOpacity="0" />
        </linearGradient>
      </defs>
      <rect width="400" height="500" fill={`url(#${uid}-bg)`} />
      {after && <ellipse cx="260" cy="120" rx="240" ry="180" fill="#bf7e84" opacity=".16" />}
      <g fill="none" strokeLinecap="round">
        {strands.map((s, i) => (
          <path key={i} d={s.d} stroke={`url(#${uid}-g${s.g})`} strokeWidth={s.w} opacity={s.o} />
        ))}
        {flyaways.map((d, i) => (
          <path key={`f${i}`} d={d} stroke="#7a6655" strokeWidth=".8" opacity=".55" />
        ))}
      </g>
      {after ? (
        <g style={{ mixBlendMode: "screen" }}>
          <rect x="-60" y="150" width="520" height="70" fill={`url(#${uid}-shine)`} transform="rotate(-7 200 185)" opacity=".75" />
          <rect x="-60" y="330" width="520" height="40" fill={`url(#${uid}-shine)`} transform="rotate(-5 200 350)" opacity=".4" />
        </g>
      ) : (
        <rect width="400" height="500" fill="#151312" opacity=".28" />
      )}
    </svg>
  );
}

// Aberto agora? Usa HOURS (horário de Brasília).
function useOpenStatus() {
  const calc = () => {
    try {
      const parts = new Intl.DateTimeFormat("en-US", { timeZone: "America/Sao_Paulo", weekday: "short", hour: "numeric", minute: "numeric", hourCycle: "h23" }).formatToParts(new Date());
      const get = (k) => parts.find((p) => p.type === k)?.value;
      const h = Number(get("hour")) + Number(get("minute")) / 60;
      return HOURS.days.includes(get("weekday")) && h >= HOURS.open && h < HOURS.close;
    } catch {
      return null;
    }
  };
  const [open, setOpen] = useState(calc);
  useEffect(() => {
    const id = setInterval(() => setOpen(calc()), 60000);
    return () => clearInterval(id);
  }, []);
  return open;
}

function LangMenu() {
  const { lang, setLang, t } = useI18n();
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const current = LANGS.find((l) => l.id === lang);
  useEffect(() => {
    if (!open) return;
    const onDown = (e) => !ref.current?.contains(e.target) && setOpen(false);
    const onKey = (e) => e.key === "Escape" && setOpen(false);
    document.addEventListener("pointerdown", onDown);
    window.addEventListener("keydown", onKey);
    return () => {
      document.removeEventListener("pointerdown", onDown);
      window.removeEventListener("keydown", onKey);
    };
  }, [open]);
  return (
    <div ref={ref} className="relative">
      <button
        type="button"
        onClick={() => setOpen((o) => !o)}
        aria-haspopup="true"
        aria-expanded={open}
        aria-label={`${t.langLabel}: ${current.name}`}

function Services() {
  const { t, lang } = useI18n();
  const [tab, setTab] = useState("cabelos");
  const [query, setQuery] = useState("");
  const [indicator, setIndicator] = useState({ left: 0, width: 0 });
  const tabRefs = useRef({});
  const barRef = useRef(null);
  const searching = query.trim().length > 0;

  const list = useMemo(() => {
    if (searching) {
      const q = normalize(query.trim());
      return SERVICES.filter((s) => {
        const [n, d] = t.serviceList[s.id];
        return normalize(`${n} ${d} ${serviceName("pt", s.id)}`).includes(q);
      });
    }
    return SERVICES.filter((s) => s.cat === tab);
  }, [tab, query, searching, t]);

  const measure = useCallback(() => {
    const el = tabRefs.current[tab];
    if (el) setIndicator({ left: el.offsetLeft, width: el.offsetWidth });
  }, [tab]);

  useLayoutEffect(() => {
    measure();
    const el = tabRefs.current[tab];
    const bar = barRef.current;
    if (el && bar && bar.scrollWidth > bar.clientWidth) bar.scrollTo({ left: el.offsetLeft - (bar.clientWidth - el.offsetWidth) / 2, behavior: "smooth" });
  }, [measure, tab, lang]);

  useEffect(() => {
    window.addEventListener("resize", measure);
    document.fonts?.ready?.then(measure);
    return () => window.removeEventListener("resize", measure);

function BeforeAfter() {
  const { t } = useI18n();
  const [pos, setPos] = useState(50);
  const [smooth, setSmooth] = useState(false);
  const [dragging, setDragging] = useState(false);
  const [wrapRef, seen] = useInViewOnce(0.4);
  const timers = useRef([]);
  const hinted = useRef(false);

  const stopHint = () => {
    timers.current.forEach(clearTimeout);
    timers.current = [];
    setSmooth(false);
  };

  useEffect(() => {
    if (!seen || hinted.current) return;
    hinted.current = true;
    if (window.matchMedia?.("(prefers-reduced-motion: reduce)").matches) return;
    setSmooth(true);
    timers.current = [setTimeout(() => setPos(30), 350), setTimeout(() => setPos(70), 1250), setTimeout(() => setPos(50), 2150), setTimeout(() => setSmooth(false), 3000)];
    return () => timers.current.forEach(clearTimeout);
  }, [seen]);

  const update = (clientX) => {
    const r = wrapRef.current.getBoundingClientRect();
    setPos(Math.max(0, Math.min(100, ((clientX - r.left) / r.width) * 100)));
  };

  return (
    <div
      ref={wrapRef}
      className={`ba relative aspect-[4/5] w-full cursor-ew-resize select-none overflow-hidden rounded-[28px] border border-white/10 shadow-[0_40px_100px_-40px_rgba(191,126,132,0.45)] ${smooth ? "ba-smooth" : ""}`}
      style={{ touchAction: "pan-y" }}
      onPointerDown={(e) => {
        stopHint();
        setDragging(true);
        wrapRef.current.setPointerCapture?.(e.pointerId);
        update(e.clientX);
      }}
      onPointerMove={(e) => dragging && update(e.clientX)}
      onPointerUp={() => setDragging(false)}
      onPointerCancel={() => setDragging(false)}
      onKeyDown={(e) => {
        if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
          e.preventDefault();
          stopHint();
          setPos((p) => Math.max(0, Math.min(100, p + (e.key === "ArrowLeft" ? -5 : 5))));
        }
      }}
      tabIndex={0}
      role="slider"
      aria-label={t.ba.aria}
      aria-valuemin={0}
      aria-valuemax={100}
      aria-valuenow={Math.round(pos)}
    >
      <div className="absolute inset-0">{CONFIG.afterImage ? <img src={CONFIG.afterImage} alt={t.ba.after} draggable="false" className="h-full w-full object-cover" /> : <HairArt variant="after" />}</div>
      <div className="ba-clip absolute inset-0" style={{ clipPath: `inset(0 ${100 - pos}% 0 0)` }}>
        {CONFIG.beforeImage ? <img src={CONFIG.beforeImage} alt={t.ba.before} draggable="false" className="h-full w-full object-cover" /> : <HairArt variant="before" />}
      </div>
      <span className="pointer-events-none absolute left-4 top-4 rounded-full border border-white/15 bg-ink/50 px-3.5 py-1.5 text-[13px] text-white/85 backdrop-blur-md transition-opacity duration-300" style={{ opacity: pos < 14 ? 0 : 1 }}>
        {t.ba.before}
      </span>
      <span className="pointer-events-none absolute right-4 top-4 rounded-full border border-malva/40 bg-ameixa/60 px-3.5 py-1.5 text-[13px] text-white backdrop-blur-md transition-opacity duration-300" style={{ opacity: pos > 86 ? 0 : 1 }}>
        {t.ba.after}
      </span>
      <div className="ba-handle pointer-events-none absolute inset-y-0 z-10" style={{ left: `${pos}%` }}>
        <div className="absolute inset-y-0 left-0 w-[2px] -translate-x-1/2 bg-gradient-to-b from-transparent via-white/90 to-transparent" />
        <div className={`absolute left-0 top-1/2 flex h-12 w-12 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full border border-white/40 bg-ameixa/70 text-white shadow-[0_0_0_6px_rgba(191,126,132,0.18),0_10px_30px_rgba(0,0,0,0.5)] backdrop-blur-md transition-transform duration-300 ${dragging ? "scale-110" : ""}`}>
          <Icon name="chevronLeft" size={15} strokeWidth={2} />
          <Icon name="chevronRight" size={15} strokeWidth={2} />
        </div>
      </div>
      <div className="pointer-events-none absolute inset-x-0 bottom-0 p-5 sm:p-6" style={{ background: "linear-gradient(to top, rgba(30,30,30,.85), transparent)" }}>
        <p className="font-display text-xl text-white sm:text-2xl">{t.ba.caption}</p>
        <p className="text-[13px] text-white/60">{t.ba.hint}</p>
      </div>
    </div>
  );
}

function Quiz() {
  const { t, lang } = useI18n();
  const [step, setStep] = useState(0);
  const [area, setArea] = useState(null);
  const [goal, setGoal] = useState(null);
  const [picked, setPicked] = useState(null);

  const choose = (id) => {
    if (picked) return;
    setPicked(id);
    setTimeout(() => {
      if (step === 0) {
        setArea(id);
        setStep(1);
      } else {
        setGoal(id);
        setStep(2);
      }
      setPicked(null);
    }, 380);
  };
  const reset = () => {
    setStep(0);
    setArea(null);
    setGoal(null);
  };

  const recIds = area && goal ? RECS[area][goal] : null;
  const recText = area && goal ? t.quiz.recs[area][goal] : null;
  const options = step === 0 ? QUIZ_AREAS.map((o) => ({ ...o, text: t.quiz.areas[o.id] })) : QUIZ_GOALS.map((o) => ({ ...o, text: t.quiz.goals[o.id] }));
  const progress = step === 0 ? 10 : step === 1 ? 55 : 100;

  return (
    <section id="quiz" className="quiz-band relative py-24 sm:py-32">
      <div className="mx-auto grid max-w-7xl items-center gap-12 px-5 sm:px-8 lg:grid-cols-[.85fr_1.15fr] lg:gap-20">
        <div>
          <SectionTitle title={t.quiz.title} text={t.quiz.text} />
          <p className="mt-6 flex items-center gap-2.5 text-sm text-white/55">
            <Icon name="clock" size={16} className="text-malva" />
            {t.quiz.time}
          </p>
        </div>
        <div className="glass relative overflow-hidden rounded-[28px] p-6 sm:p-9">
          <div className="flex items-center justify-between text-[13px] text-white/55">
            <span aria-live="polite">{step < 2 ? t.quiz.question(step + 1) : t.quiz.result}</span>
            {step > 0 && (
              <button
                type="button"
                onClick={
                  step === 2
                    ? reset
                    : () => {
                        setStep(0);
                        setArea(null);
                      }
                }
                className="flex items-center gap-1.5 rounded-full px-2 py-1 transition-colors hover:text-white"
              >
                <Icon name={step === 2 ? "rotateCcw" : "chevronLeft"} size={14} />
                {step === 2 ? t.quiz.restart : t.quiz.back}
              </button>
            )}
          </div>
          <div className="mt-4 h-1 overflow-hidden rounded-full bg-white/10">
            <div className="h-full rounded-full transition-[width] duration-700 ease-out" style={{ width: `${progress}%`, background: "linear-gradient(90deg,#795f68,#bf7e84,#f0c9c4)" }} />
          </div>
          <div key={step} className="step-in mt-8">
            {step < 2 ? (
              <>
                <h3 className="font-display text-[2rem] leading-tight text-white sm:text-4xl">{step === 0 ? t.quiz.q1 : t.quiz.q2}</h3>
                <div className="mt-7 grid grid-cols-2 gap-3">
                  {options.map((o) => {
                    const isPicked = picked === o.id;
                    return (
                      <button
                        key={o.id}
                        type="button"
                        onClick={() => choose(o.id)}
                        className={`group flex flex-col items-start gap-3 rounded-2xl border p-4 text-left transition-all duration-300 sm:p-5 ${isPicked ? "scale-[0.98] border-malva bg-malva/15" : "border-white/10 bg-white/[0.03] hover:-translate-y-1 hover:border-malva/60 hover:bg-white/[0.06]"}`}
                      >
                        <span className={`flex h-10 w-10 items-center justify-center rounded-xl transition-colors duration-300 ${isPicked ? "bg-malva text-white" : "bg-ameixa/80 text-malva group-hover:bg-malva group-hover:text-white"}`}>
                          <Icon name={isPicked ? "check" : o.icon} size={18} />
                        </span>
                        <span>
                          <span className="block text-[15px] font-medium leading-snug text-white">{o.text[0]}</span>
                          <span className="mt-1 block text-[13px] text-white/50">{o.text[1]}</span>
                        </span>
                      </button>
                    );
                  })}
                </div>
              </>
            ) : (
              recIds && (
                <div className="relative">
                  <div className="pointer-events-none absolute left-1/2 top-6" aria-hidden="true">
                    {BURST.map(([dx, dy], i) => (
                      <span key={i} className="burst" style={{ "--dx": `${dx}px`, "--dy": `${dy}px`, animationDelay: `${i * 20}ms` }} />
                    ))}
                  </div>
                  <p className="text-[13px] text-malva">{t.quiz.ideal}</p>
                  <h3 className="text-metal mt-3 font-display text-[2.4rem] font-medium leading-[1.05] sm:text-5xl">{recIds.map((id) => serviceName(lang, id)).join(" + ")}</h3>
                  <p className="mt-4 text-[16px] font-light leading-relaxed text-white/75">{recText[0]}</p>
                  <div className="mt-6 flex flex-wrap gap-2 text-[13px]">
                    <span className="flex items-center gap-1.5 rounded-full border border-taupe/50 px-3 py-1.5 text-white/75">
                      <Icon name="clock" size={14} className="text-malva" />
                      {recText[1]}
                    </span>
                    <span className="rounded-full border border-taupe/50 px-3 py-1.5 text-white/75">{t.quiz.areas[area][0]}</span>
                    <span className="rounded-full border border-taupe/50 px-3 py-1.5 text-white/75">{t.quiz.goals[goal][0]}</span>
                  </div>
                  <div className="mt-8 flex flex-col gap-3 sm:flex-row">
                    <a {...bookingLink({ services: recIds })} className="btn-primary px-7 py-4 text-[15px]">
                      <Icon name="calendar" size={18} />
                      {t.quiz.book}
                    </a>
                    <button type="button" onClick={reset} className="btn-glass px-7 py-4 text-[15px]">
                      <Icon name="rotateCcw" size={16} />
                      {t.quiz.redo}
                    </button>
                  </div>
                </div>
              )
            )}
          </div>
        </div>
      </div>
    </section>
  );
}

function StudioSpace() {
  const { t } = useI18n();
  const railRef = useRef(null);
  const [active, setActive] = useState(0);

  const goTo = (i) => {
    const rail = railRef.current;
    const card = rail?.children[i];
    if (!card) return;
    const pad = parseFloat(getComputedStyle(rail).paddingLeft) || 0;
    const reduce = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
    rail.scrollTo({ left: card.offsetLeft - pad, behavior: reduce ? "auto" : "smooth" });
  };

  useEffect(() => {
    const rail = railRef.current;
    if (!rail) return;
    let raf = 0;
    const onScroll = () => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        const pad = parseFloat(getComputedStyle(rail).paddingLeft) || 0;
        const atEnd = rail.scrollLeft + rail.clientWidth >= rail.scrollWidth - 4;
        if (atEnd) return setActive(rail.children.length - 1);
        let best = 0;
        let bestDist = Infinity;
        [...rail.children].forEach((c, i) => {
          const d = Math.abs(c.offsetLeft - pad - rail.scrollLeft);
          if (d < bestDist) {
            bestDist = d;
            best = i;
          }
        });
        setActive(best);
      });
    };
    rail.addEventListener("scroll", onScroll, { passive: true });
    return () => rail.removeEventListener("scroll", onScroll);
  }, []);

  const total = STUDIO_PHOTOS.length;
  const pad2 = (n) => String(n).padStart(2, "0");

  return (
    <section id="espaco" className="relative overflow-hidden py-24 sm:py-32">

        <div className="flex flex-col gap-8 sm:flex-row sm:items-end sm:justify-between">

            <span className="font-display text-xl tabular-nums text-white/70" aria-live="polite">
              {pad2(active + 1)} <span className="text-white/30">/ {pad2(total)}</span>
            </span>
            <button type="button" onClick={() => goTo(Math.max(0, active - 1))} disabled={active === 0} className="icon-btn disabled:pointer-events-none disabled:opacity-30" aria-label={t.space.prev}>
              <Icon name="arrowLeft" size={18} />
            </button>
            <button type="button" onClick={() => goTo(Math.min(total - 1, active + 1))} disabled={active === total - 1} className="icon-btn disabled:pointer-events-none disabled:opacity-30" aria-label={t.space.next}>
              <Icon name="arrowRight" size={18} />
            </button>
          </div>
        </div>

        <div ref={railRef} className="no-scrollbar relative -mx-5 mt-12 flex snap-x snap-mandatory gap-3 overflow-x-auto scroll-px-5 px-5 pb-2 sm:-mx-8 sm:gap-4 sm:scroll-px-8 sm:px-8 lg:-mx-[max(2rem,calc(50vw-608px))] lg:scroll-px-[max(2rem,calc(50vw-608px))] lg:px-[max(2rem,calc(50vw-608px))]">
          {STUDIO_PHOTOS.map((p, i) => {
            const [tag, caption, alt] = t.space.cards[i];
            return (
              <figure
                key={p.src}
                tabIndex={0}
                className="group relative aspect-[3/4] w-[82vw] max-w-[420px] shrink-0 snap-start overflow-hidden rounded-[24px] border border-white/[0.06] bg-surface transition-[border-color,box-shadow] duration-700 hover:border-[#bf7e84]/60 hover:shadow-[0_30px_70px_-30px_rgba(191,126,132,0.5)] focus:border-[#bf7e84]/60 sm:w-[360px] lg:w-[400px]"
              >
                <img
                  src={p.src}
                  alt={alt}
                  loading="lazy"
                  decoding="async"
                  draggable="false"
                  style={{ objectPosition: p.position || "50% 50%" }}
                  className="absolute inset-0 h-full w-full object-cover object-center brightness-[0.90] contrast-[1.06] saturate-[0.88] transition-all duration-700 ease-out group-hover:scale-105 group-hover:brightness-100 group-hover:saturate-100 group-focus:scale-105 group-focus:brightness-100 group-focus:saturate-100"
                />
                <div className="pointer-events-none absolute inset-0 bg-[#462536]/20 mix-blend-multiply transition-opacity duration-700 group-hover:opacity-0 group-focus:opacity-0" />
                <div className="pointer-events-none absolute inset-x-0 bottom-0 h-[35%] bg-gradient-to-t from-[#1e1e1e] via-[#1e1e1e]/60 to-transparent" />
                <span className="absolute left-4 top-4 z-10 max-w-[calc(100%-2rem)] rounded-full border border-white/15 bg-[#1e1e1e]/45 px-3.5 py-1.5 text-[12px] text-white/90 backdrop-blur-md sm:left-5 sm:top-5">{tag}</span>
                {p.detail && (
                  <span className="absolute right-4 top-16 z-10 h-[4.5rem] w-28 overflow-hidden rounded-xl border border-[#bf7e84]/50 shadow-[0_14px_30px_-12px_rgba(0,0,0,0.8)] sm:right-5 sm:h-20 sm:w-32">
                    <img src={p.detail} alt={t.space.detailAlt} loading="lazy" draggable="false" className="h-full w-full object-cover brightness-[0.9] contrast-[1.06] saturate-[0.88] transition-all duration-700 group-hover:brightness-100 group-hover:saturate-100" />
                  </span>
                )}
                <figcaption className="absolute inset-x-0 bottom-0 z-10 p-5 transition-transform duration-700 ease-out group-hover:-translate-y-1 sm:p-6">
                  <p className="font-display text-[1.2rem] leading-snug text-white [text-shadow:0_2px_18px_rgba(0,0,0,0.6)] sm:text-[1.4rem]">{caption}</p>
                </figcaption>
              </figure>

          })}
        </div>
        <div className="mt-6 h-px overflow-hidden bg-white/10" aria-hidden="true">

function Booking() {

  });
  const [pro, setPro] = useState(null);
  const [services, setServices] = useState([]);
  const [cat, setCat] = useState("cabelos");
  const [shift, setShift] = useState(null);

  const [touched, setTouched] = useState(false);
  const [flash, setFlash] = useState(0);
  const [shake, setShake] = useState(0);

  const servicesRef = useRef(null);

  useEffect(() => {
    try {
      localStorage.setItem("euphoria:nome", name);
    } catch {}
  }, [name]);

  useEffect(() => {
    const onOpen = (e) => {
      const d = e.detail || {};
      if (d.pro) {
        setPro(d.pro);
        const p = PROS.find((x) => x.id === d.pro);
        if (p) setCat(p.cat);
      }
      if (d.services?.length) {
        setServices((prev) => [...prev, ...d.services.filter((id) => !prev.includes(id))]);
        const s = SERVICES.find((x) => x.id === d.services[0]);
        if (s) setCat(s.cat);
      }
      setFlash((f) => f + 1);
    };
    window.addEventListener(BOOKING_EVENT, onOpen);
    return () => window.removeEventListener(BOOKING_EVENT, onOpen);
  }, []);

  const choosePro = (id) => {
    const next = pro === id ? null : id;
    setPro(next);
    const p = PROS.find((x) => x.id === next);
    if (p && services.length === 0) setCat(p.cat);
  };
  const toggleService = (id) => {
    const removing = services.includes(id);
    setServices((prev) => (removing ? prev.filter((x) => x !== id) : [...prev, id]));
    if (removing && id === MAKEUP_ID && pro === FOUNDER.id) setPro(null);
  };
  const hasMakeup = services.includes(MAKEUP_ID);

  const cleanName = name.trim();
  const cleanWhen = when.trim();
  const proName = (id) => (id === FOUNDER.id ? b.makeupLabel : PROS.find((x) => x.id === id)?.name);

  const proLabel = pro ? proName(pro) : derived.length ? `${derived.map(proName).join(", ")} (${b.suggested})` : b.proFallback;
  const shiftLabel = (b.shifts[shift] || b.shifts.flexivel)[0];
  const serviceList = services.map((id) => serviceNameForMessage(lang, id)).join(", ");
  const valid = cleanName.length > 0 && services.length > 0;
  const doneCount = [cleanName, pro, services.length, shift].filter(Boolean).length;

  const lines = [langTag[lang] + b.msg.intro(cleanName), b.msg.services + serviceList, b.msg.pro + proLabel, b.msg.shift + shiftLabel];
  if (cleanWhen) lines.push(b.msg.when + cleanWhen);
  lines.push(b.msg.outro);
  const link = waUrl(lines.join("\n"));

  const onSend = (e) => {
    if (valid) return;
    e.preventDefault();
    setTouched(true);
    setShake((s) => s + 1);
    if (!cleanName) nameRef.current?.focus();
    else servicesRef.current?.scrollIntoView({ behavior: "smooth", block: "center" });

  const reset = () => {
    setPro(null);
    setServices([]);
    setShift(null);
    setWhen("");
    setTouched(false);
  };

  const introParts = b.msg.intro("§NAME§").split("*§NAME§*");

  const placeholder = (txt) => <span className="italic text-white/40">{txt}</span>;

                      >
                        <span className={`relative h-14 w-14 shrink-0 overflow-hidden rounded-full border-2 transition-colors sm:h-16 sm:w-16 ${sel ? "border-malva" : "border-malva/40"}`}>
                          <Portrait person={p} tone={i + 1} small />

                        <span className="min-w-0 flex-1">

                  {services.length > 0 && (
                    <div className="mt-5 flex flex-wrap items-center gap-2 border-t border-white/[0.07] pt-5">
                      <span className="mr-1 text-[13px] text-white/50">{b.selected}</span>
                      {services.map((id) => (
                        <span key={id} className="fade-up inline-flex items-center gap-1 rounded-full bg-ameixa/80 py-1 pl-3 pr-1 text-[13px] text-white">
                          {serviceName(lang, id)}
                          <button type="button" onClick={() => toggleService(id)} className="flex h-6 w-6 items-center justify-center rounded-full text-white/60 transition hover:bg-white/10 hover:text-white" aria-label={b.remove(serviceName(lang, id))}>
                            <Icon name="x" size={13} />
                          </button>
                        </span>
                      ))}
                    </div>
                  )}
                  {touched && services.length === 0 && <p className="mt-3 text-[13px] text-malva">{b.servicesError}</p>}
                </div>
              </BookingStep>

              <BookingStep n={4} title={b.steps[3]} done={!!shift} last>
                <div className="grid grid-cols-3 gap-2 sm:gap-3">
                  {SHIFTS.map((s) => {
                    const sel = shift === s.id;
                    const [label, hint] = b.shifts[s.id];
                    return (
                      <button key={s.id} type="button" aria-pressed={sel} onClick={() => setShift(s.id)} className={`flex flex-col items-center gap-2 rounded-2xl border px-2 py-4 text-center transition-all duration-300 ${sel ? "border-malva bg-malva/15 text-white" : "border-white/10 bg-white/[0.03] text-white/70 hover:-translate-y-0.5 hover:border-malva/60 hover:text-white"}`}>
                        <Icon name={s.icon} size={20} className={sel ? "text-malva" : ""} />
                        <span className="text-[15px] font-medium">{label}</span>
                        <span className="text-[11px] text-white/45 sm:text-[12px]">{hint}</span>
                      </button>
                    );
                  })}
                </div>
                <label className="mt-5 block">
                  <span className="text-[14px] text-white/70">
                    {b.whenLabel} <span className="text-white/40">({b.optional})</span>
                  </span>
                  <input type="text" value={when} onChange={(e) => setWhen(e.target.value)} placeholder={b.whenPlaceholder} maxLength={80} className="search-input mt-2 w-full rounded-2xl border border-white/10 bg-white/[0.04] px-5 py-4 text-base text-white outline-none transition placeholder:text-white/35 focus:border-malva/60 focus:bg-white/[0.06]" />
                </label>
                <div className="mt-3 flex flex-wrap gap-2">
                  {b.whenIdeas.map((w) => (
                    <button key={w} type="button" onClick={() => setWhen(w)} className={`rounded-full border px-3 py-1.5 text-[12px] transition ${cleanWhen === w ? "border-malva/70 text-white" : "border-white/10 text-white/55 hover:border-malva/50 hover:text-white"}`}>
                      {w}
                    </button>
                  ))}
                </div>
              </BookingStep>
            </ol>
          </div>

          <aside className="min-w-0 lg:sticky lg:top-24">
            <div className="glass relative overflow-hidden rounded-[28px] p-5 sm:p-7">
              <div className="flex items-center justify-between">
                <p className="font-display text-2xl text-white">{b.summary}</p>
                <span className="text-[13px] text-white/55">{b.progress(doneCount)}</span>
              </div>
              <div className="mt-3 h-1 overflow-hidden rounded-full bg-white/10">
                <div className="h-full rounded-full transition-[width] duration-700 ease-out" style={{ width: `${Math.max(6, doneCount * 25)}%`, background: "linear-gradient(90deg,#795f68,#bf7e84,#f0c9c4)" }} />
              </div>
              <div className="mt-6 overflow-hidden rounded-2xl border border-white/10 bg-ink/60">
                <div className="flex items-center gap-3 border-b border-white/[0.07] px-4 py-3">
                  <LogoMark className="h-8 w-8" />
                  <div className="min-w-0">
                    <p className="truncate text-sm text-white">Euphoria Studio de Beleza</p>
                    <p className="text-[11px] text-white/45">{b.previewTitle}</p>
                  </div>
                </div>
                <div className="p-4" aria-live="polite">
                  <div className="ml-auto max-w-[96%] rounded-2xl rounded-tr-sm bg-ameixa/85 px-4 py-3 text-[14px] leading-relaxed text-white/90 shadow-[0_10px_30px_-18px_rgba(0,0,0,0.9)]">
                    {langTag[lang] && <p className="mb-1 text-[12px] text-malva">{langTag[lang].trim()}</p>}
                    <p>
                      {introParts[0]}
                      {cleanName ? <strong className="font-semibold text-white">{cleanName}</strong> : placeholder(b.phName)}
                      {introParts[1]}
                    </p>
                    <p className="mt-2">
                      {b.msg.services}
                      {services.length ? serviceList : placeholder(b.phServices)}
                    </p>
                    <p>{b.msg.pro + proLabel}</p>
                    <p>{b.msg.shift + shiftLabel}</p>
                    {cleanWhen && <p>{b.msg.when + cleanWhen}</p>}
                    <p className="mt-2">{b.msg.outro}</p>
                    <span className="mt-1 block text-right text-[10px] text-white/40">{b.now}</span>
                  </div>
                </div>
              </div>
              {!valid && <p className="mt-4 text-[13px] text-white/55">{b.missing(missing)}</p>}
              <a key={`send-${shake}`} href={valid ? link : "#agendar"} {...(valid ? ext : {})} onClick={onSend} aria-disabled={!valid} className={`btn-primary mt-4 w-full py-4 text-[15px] ${valid ? "" : "is-disabled"} ${shake ? "shake" : ""}`}>
                <WhatsIcon size={18} />
                {b.send}
              </a>
              <p className="mt-3 text-center text-[12px] text-white/45">{b.note}</p>
              {(pro || services.length > 0 || shift || when) && (
                <button type="button" onClick={reset} className="mx-auto mt-3 flex items-center gap-1.5 text-[13px] text-white/45 transition-colors hover:text-white">
                  <Icon name="rotateCcw" size={13} />
                  {b.reset}
                </button>
              )}
            </div>
          </aside>
        </div>
      </div>
    </section>
  );
}

function Contact() {
  const { t, lang } = useI18n();
  const c = t.contact;
  const isOpen = useOpenStatus();
  const status =
    isOpen === null ? null : (
      <span className={`inline-flex items-center gap-2 rounded-full px-3 py-1 text-xs ${isOpen ? "bg-[#7fd1a5]/10 text-[#a6e3c3]" : "bg-white/5 text-white/60"}`}>
        <span className={`h-1.5 w-1.5 rounded-full ${isOpen ? "animate-pulse bg-[#7fd1a5]" : "bg-taupe"}`} />
        {isOpen ? c.openNow : c.closedNow}
      </span>
    );
  return (
    <section id="contato" className="relative py-24 sm:py-32">
      <div className="mx-auto max-w-7xl px-5 sm:px-8">
        <SectionTitle title={c.title} text={c.text} />
        <div className="mt-12 grid gap-5 lg:grid-cols-[.85fr_1.15fr]">
          <div className="flex flex-col gap-4">
            <InfoRow icon="mapPin" title={c.address}>
              <p>{ADDRESS.street}</p>
              <p>
                {ADDRESS.city}, {ADDRESS.cep}

              <p className="text-malva">{c.reference}</p>

            <InfoRow icon="clock" title={c.hours} aside={status}>
              <p className="flex justify-between gap-4">
                <span>{c.days}</span>
                <span className="text-white">{c.range}</span>
              </p>
              <p className="flex justify-between gap-4">
                <span>{c.closedDays}</span>
                <span>{c.closed}</span>
              </p>
            </InfoRow>
            <div className="grid gap-4 sm:grid-cols-2">
              <InfoRow icon="whatsapp" title={c.whatsapp}>
                <a href={waHello(lang)} {...ext} className="text-white underline decoration-malva/50 underline-offset-4 transition hover:decoration-malva">
                  {WHATSAPP_DISPLAY}
                </a>
              </InfoRow>
              <InfoRow icon="instagram" title="Instagram">
                <a href={IG_URL} {...ext} className="break-all text-white underline decoration-malva/50 underline-offset-4 transition hover:decoration-malva">
                  @{CONFIG.instagram}
                </a>
              </InfoRow>
            </div>
            <div className="mt-2 flex flex-col gap-3 sm:flex-row">
              <a href={MAPS_ROUTE} {...ext} className="btn-primary flex-1 px-6 py-4 text-[15px]">
                <Icon name="navigation" size={17} />
